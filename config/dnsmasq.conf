# ------------------------------------------------------------------
# CN Project Phase 1 - private DNS server on Mac 1 (Sanath)
# Install as:  $(brew --prefix)/etc/dnsmasq.conf   (replace the whole file)
# 10.7.7.6 / 10.7.17.6 / 10.7.9.214 are filled in by configure.sh
# ------------------------------------------------------------------

# Do not read /etc/resolv.conf. Names that are not ours (google.com etc.)
# are forwarded to these public resolvers instead.
# If your network blocks them, replace with your router's IP (the gateway).
no-resolv
server=1.1.1.1
server=8.8.8.8

# Never forward plain one-word names or private reverse lookups upstream
domain-needed
bogus-priv

# team1.test belongs to us: answer it locally, never ask the internet.
# A name under team1.test that has no record gets NXDOMAIN.
local=/team1.test/

# ---- Project records (A records) ----
# The application names point at the EDGE (Mac 2), never at a backend.
host-record=app.team1.test,10.7.17.6
host-record=api.team1.test,10.7.17.6

# Machine names, handy for ping by name
host-record=dns.team1.test,10.7.7.6
host-record=edge.team1.test,10.7.17.6
host-record=backend-a.team1.test,10.7.9.214
host-record=backend-b.team1.test,10.7.7.6

# TTL in seconds for the records above (dnsmasq's default is 0)
local-ttl=60

# Log every query - useful evidence (tail -f /tmp/dnsmasq.log)
log-queries
log-facility=/tmp/dnsmasq.log
