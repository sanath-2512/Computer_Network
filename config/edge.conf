# ------------------------------------------------------------------
# CN Project Phase 1 - edge reverse proxy + load balancer + TLS (Mac 2, Aryan)
# Install as:  $(brew --prefix)/etc/nginx/servers/edge.conf
# 10.7.7.6 / 10.7.9.214 are filled in by configure.sh
# Homebrew's main nginx.conf already has "include servers/*;" inside http { }.
# ------------------------------------------------------------------

# The backend pool. Default strategy = round-robin: A, B, A, B ...
upstream team1_backends {
    server 10.7.9.214:3001 max_fails=1 fail_timeout=10s;   # Backend A  (Mac 3, Krishna)
    server 10.7.7.6:3002 max_fails=1 fail_timeout=10s;   # Backend B  (Mac 1, Sanath)
}

# Plain HTTP on port 80 -> redirect to HTTPS
server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

# HTTPS on port 443: TLS terminates here
server {
    listen 443 ssl;          # if 443 fails: listen 8443 ssl; and use https://app.team1.test:8443
    http2 on;                # nginx >= 1.25.1. Older nginx: delete this line, use "listen 443 ssl http2;"
    server_name app.team1.test api.team1.test;

    # Relative paths = relative to the nginx config folder, $(brew --prefix)/etc/nginx/
    ssl_certificate     certs/server.crt;
    ssl_certificate_key certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Browsers ask for /favicon.ico with every page. Answer it here, so it
    # does not use up a round-robin turn and break the A/B alternation.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location / {
        proxy_pass http://team1_backends;

        # Tell the backend the original host and client
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Failover: give up on a dead backend after 2 s and retry the request
        # on the other one. max_fails/fail_timeout above then skip it for 10 s.
        proxy_connect_timeout 2s;
        proxy_next_upstream   error timeout http_502 http_503;
    }
}
