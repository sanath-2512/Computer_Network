# CN Project Phase 2 - Dedicated Backup DNS (Aryan's Mac)
port=53
listen-address=10.7.11.108
bind-interfaces
no-resolv
server=1.1.1.1
server=8.8.8.8
domain-needed
bogus-priv
local=/team1.test/
local-ttl=30

# Application records (TTL 30)
host-record=app.team1.test,10.7.11.108,30
host-record=api.team1.test,10.7.11.108,30

# Infrastructure host records
host-record=dns-primary.team1.test,10.7.9.214
host-record=dns-backup.team1.test,10.7.11.108
host-record=edge.team1.test,10.7.11.108
host-record=backend-a.team1.test,10.7.11.108
host-record=backend-b.team1.test,10.7.11.108

# Runtime management
pid-file=/Users/aryan./.cn-team1-phase2/pids/dnsmasq-backup.pid
log-queries
log-facility=/Users/aryan./.cn-team1-phase2/logs/dnsmasq-backup.log
