# CN Project Phase 2 - Primary DNS on Krishna (10.7.9.214)
port=53
listen-address=10.7.9.214
listen-address=127.0.0.1
bind-interfaces
no-resolv
server=1.1.1.1
server=8.8.8.8
domain-needed
bogus-priv
