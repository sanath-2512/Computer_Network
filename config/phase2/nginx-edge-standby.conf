# CN Project Phase 2 - Standby Edge on Krishna (10.7.9.214) for Extension E
# NOTE: Absolute paths configured for Krishna's macOS environment.
worker_processes 1;
pid /Users/krishna/.cn-team1-phase2/pids/nginx-standby.pid;
error_log /Users/krishna/.cn-team1-phase2/logs/nginx-standby-error.log info;

events { worker_connections 1024; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /Users/krishna/.cn-team1-phase2/logs/nginx-standby-access.log;

    upstream team1_backends {
        server 10.7.11.108:3001 max_fails=1 fail_timeout=10s;
        server 10.7.11.108:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/krishna/.cn-team1-phase2/identity/server.crt;
        ssl_certificate_key /Users/krishna/.cn-team1-phase2/identity/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://team1_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
