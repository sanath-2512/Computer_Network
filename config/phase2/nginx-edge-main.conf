# CN Project Phase 2 - Standalone Main Nginx Edge (Aryan's Mac)
worker_processes 1;
pid /Users/aryan./.cn-team1-phase2/pids/nginx.pid;
error_log /Users/aryan./.cn-team1-phase2/logs/nginx-error.log info;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$upstream_status"';

    access_log /Users/aryan./.cn-team1-phase2/logs/nginx-access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Backend pool: round-robin across local Python services
    upstream team1_backends {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=10s;
    }

    # HTTP port 80 -> redirect to HTTPS
    server {
        listen 80;
        server_name app.team1.test api.team1.test;
        return 301 https://$host$request_uri;
    }

    # HTTPS port 443: TLS termination + HTTP/2
    server {
        listen 443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/aryan./.cn-team1-phase2/identity/server.crt;
        ssl_certificate_key /Users/aryan./.cn-team1-phase2/identity/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        location / {
            proxy_pass http://team1_backends;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
            proxy_next_upstream   error timeout http_502 http_503;
        }
    }
}
